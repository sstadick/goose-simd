name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      runners:
        description: 'Runner labels as a JSON array; use an AVX-512-capable runner for that ISA'
        default: '["ubuntu-24.04", "ubuntu-24.04-arm"]'
        type: string
      require_isa:
        description: 'Required native ISA (fails on the wrong hardware)'
        default: auto
        type: choice
        options: [auto, avx2, avx512, neon]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners || '["ubuntu-24.04", "ubuntu-24.04-arm"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out Goose
        uses: actions/checkout@v4
        with:
          repository: aardappel/goose
          # Verified compiler revision with execution-based checkfree validation.
          ref: 4602c98660676b2cb94bc9b06fec8c65b37fce92
          path: .ci/goose
          persist-credentials: false
      - name: Check out goose-doc
        uses: actions/checkout@v4
        with:
          repository: sstadick/goose-doc
          ref: f7292c9ee395596fa39eb709f90dc71ef124a0eb # namespace migration
          path: .ci/goose-doc
          persist-credentials: false
      - name: Build Goose
        run: |
          cmake -S .ci/goose -B .ci/goose/build -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DGOOSE_BUILTIN_LIBS=
          cmake --build .ci/goose/build --parallel 2
          echo "$GITHUB_WORKSPACE/.ci/goose/build" >> "$GITHUB_PATH"
      - name: Check API reference
        env:
          GOOSE_DOC: .ci/goose-doc/main.goose
        run: scripts/docs.sh --check
      - name: Run documentation examples
        env:
          GOOSE_DOC: .ci/goose-doc/main.goose
        run: |
          scripts/doctest.sh
          scripts/doctest.sh --cc clang
      - name: Generate release reference
        if: matrix.runner == 'ubuntu-24.04'
        env:
          GOOSE_DOC: .ci/goose-doc/main.goose
          DOC_OUTPUT: ${{ runner.temp }}/API.md
        run: scripts/docs.sh --source-url "https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'ubuntu-24.04'
        with:
          name: api-reference
          path: ${{ runner.temp }}/API.md
          if-no-files-found: error
      - name: TinyCC and Clang SIMD tests
        env:
          REQUIRE_ISA: ${{ inputs.require_isa || 'auto' }}
        run: |
          avx2=()
          if grep -qw avx2 /proc/cpuinfo; then
            avx2=(--avx2)
          else
            echo "AVX2 tests skipped: runner CPU does not support AVX2"
          fi
          if [[ "$REQUIRE_ISA" == auto && "$(uname -m)" == aarch64 ]]; then
            REQUIRE_ISA=neon
          fi
          python3 test/run.py --cc clang "${avx2[@]}" --require-isa "$REQUIRE_ISA"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: api-reference
          path: docs
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/API.md --clobber
          else
            gh release create "$TAG" docs/API.md --verify-tag --generate-notes
          fi
